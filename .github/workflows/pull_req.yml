Name: Event demo1
on:
  pull_request:
    types:
    - opened               #activity type
    branches:
    - main                #event filter
    - 'dev-*'             #event filter    
    - 'feat/**'     
  workflow_dispatch:
  push: 
   branches:
    - main         
    - 'dev-*'       #dev-new ,dev-this-is-new
    - 'feat/**'     #feat/new,  feat/new/button
jobs:
   deploy:
    runs-on: ubuntu-latest
    steps:
     - name: output event mode
       run: echo "${{ toJSON(github.event) }}"
     - name: Get code
       uses: actions/checkout@v7
     - name: Install dependencies
       run: npm ci
     - name: Test code
       run: npm run test
     - name: Build code 
       run: npm run build 
     - name: Deploy project
       run: echo "Deploying"
